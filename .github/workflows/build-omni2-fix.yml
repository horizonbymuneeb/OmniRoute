name: Build Omni2 Fix Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to build
        required: true
        default: fix/agy-provider-routing

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner-base
          platforms: linux/amd64
          push: true
          tags: ghcr.io/horizonbymuneeb/omniroute:omni2-agy-c028e2f
          cache-from: type=gha,scope=omni2-agy-amd64
          cache-to: type=gha,scope=omni2-agy-amd64,mode=max
